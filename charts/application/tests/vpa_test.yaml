suite: vpa
templates:
  - vpa.yaml
tests:
  - it: enabled false renders nothing
    asserts:
      - hasDocuments:
          count: 0

  - it: renders with the default name and quoted updateMode
    set:
      vpa.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: application-vpa
      - equal:
          path: spec.updatePolicy.updateMode
          value: "Off"
      - equal:
          path: spec.targetRef.kind
          value: Deployment
      - equal:
          path: spec.targetRef.name
          value: application

  - it: name overrides via vpa.name
    set:
      vpa.enabled: true
      vpa.name: custom-vpa
    asserts:
      - equal:
          path: metadata.name
          value: custom-vpa
