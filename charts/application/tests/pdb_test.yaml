suite: pdb
templates:
  - pdb.yaml
tests:
  - it: maxUnavailable renders alone when minAvailable is null
    set:
      pdb.enabled: true
      pdb.minAvailable: null
      pdb.maxUnavailable: 2
    asserts:
      - notExists:
          path: spec.minAvailable
      - equal:
          path: spec.maxUnavailable
          value: 2
      - exists:
          path: metadata.namespace

  - it: both minAvailable and maxUnavailable render when both set
    set:
      pdb.enabled: true
      pdb.minAvailable: 1
      pdb.maxUnavailable: 2
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.maxUnavailable
          value: 2

  - it: selector is the single app label
    set:
      pdb.enabled: true
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app: application
