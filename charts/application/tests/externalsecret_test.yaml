suite: externalsecret
templates:
  - externalsecret.yaml
tests:
  - it: enabled false renders nothing
    asserts:
      - hasDocuments:
          count: 0

  - it: name defaults to applicationName
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: my-store
    asserts:
      - equal:
          path: metadata.name
          value: application
      - equal:
          path: spec.target.name
          value: application

  - it: data entries carry the ESO admission defaults
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: my-store
      externalSecret.data:
        - secretKey: DB_PASSWORD
          remoteRef:
            key: my-project/DB_PASSWORD
    asserts:
      - equal:
          path: spec.data[0].remoteRef.conversionStrategy
          value: Default
      - equal:
          path: spec.data[0].remoteRef.decodingStrategy
          value: None
      - equal:
          path: spec.data[0].remoteRef.metadataPolicy
          value: None
