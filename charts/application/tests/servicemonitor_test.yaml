suite: servicemonitor
templates:
  - servicemonitor.yaml
tests:
  - it: enabled false renders nothing
    asserts:
      - hasDocuments:
          count: 0

  - it: name defaults to applicationName-svc-monitor
    set:
      serviceMonitor.enabled: true
      serviceMonitor.endpoints:
        - port: http
          path: /metrics
          interval: 30s
    asserts:
      - equal:
          path: metadata.name
          value: application-svc-monitor
      - equal:
          path: spec.endpoints[0].port
          value: http

  - it: serviceMonitor.name overrides the default
    set:
      serviceMonitor.enabled: true
      serviceMonitor.name: executor
      serviceMonitor.endpoints:
        - port: http
    asserts:
      - equal:
          path: metadata.name
          value: executor
