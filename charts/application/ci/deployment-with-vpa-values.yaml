# Rendered from JupiterOne/sample-app live-parity fixtures (2026-09-16). Exercises the
# env fan-out, downward API, ExternalSecret keys and the opt-out of chart labels.
applicationName: executor
labels:
  chartLabels: false
commonLabels:
  ManagedEnvironment: sample-env
  ManagedProject: sample-app
  ManagedService: executor
  app: executor
  environment: sample-env
  platform: aws_eks
  service.name: executor
  tags.environment: sample-env
  tags.platform: aws_eks
  tags.project: sample-app
  tags.service.name: executor
commonAnnotations:
  owner: '@example/platform'
  tags.CodeOwner: '@example/platform'
rbac:
  enabled: true
  serviceAccount:
    enabled: false
    name: sample-ns-j1ql-executor
  roles:
  - name: pod-annotations
    roleName: executor-pod-annotations
    bindingName: executor-pod-annotations
    roleLabels: {}
    bindingLabels:
      service.namespace: sample-ns
      tags.service.namespace: sample-ns
    rules:
    - apiGroups:
      - ''
      resources:
      - pods
      verbs:
      - update
      - patch
      - get
service:
  enabled: false
pdb:
  enabled: true
  minAvailable: null
  maxUnavailable: 1
deployment:
  enabled: true
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  additionalPodAnnotations: {}
  podLabels: &id001
    service.namespace: sample-ns
    tags.service.namespace: sample-ns
  additionalLabels: *id001
  priorityClassName: high-priority
  terminationGracePeriodSeconds: 30
  automountServiceAccountToken: true
  nodeSelector:
    Team: platform-team
    karpenter.sh/nodepool: platform-team
  tolerations:
  - effect: NoSchedule
    key: Team
    operator: Equal
    value: platform-team
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - executor
        topologyKey: kubernetes.io/hostname
  containerName: executor
  image:
    ref: 123456789012.dkr.ecr.us-east-1.amazonaws.com/sample/executor/development:1.2.3
    pullPolicy: null
  resources:
    limits:
      cpu: 1024m
      ephemeral-storage: 30Gi
      memory: 4Gi
    requests:
      cpu: 50m
      ephemeral-storage: 8Gi
      memory: 1Gi
  ports: null
  lifecycle: null
  envDownwardApi:
  - name: KUBERNETES_POD_NAME
    fieldPath: metadata.name
  - name: KUBERNETES_NAMESPACE
    fieldPath: metadata.namespace
  envFromConfigMap:
    name: executor
    immutable: false
    keys:
      AWS_REGION: us-east-1
      AWS_SDK_JS_SUPPRESS_MAINTENANCE_MODE_MESSAGE: '1'
      CASE_STATUS_REFRESH_DEAD_LETTER_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/sample-app-case-status-refresh-dead-letter-queue-002
      CASE_STATUS_REFRESH_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/sample-app-case-status-refresh-queue-002
      COLLECTOR_TAG: latest
      ENVIRONMENT: sample-env
      EVENTS_STREAM_ARN: arn:aws:kinesis:us-east-1:123456789012:stream/sample-app-events-stream-002
      INTERNAL_API_BASE_URL: https://api.example.internal
      J1DS_ROLE_ARN: arn:aws:iam::123456789012:role/example-data-streaming
      JIRA_INBOUND_DEAD_LETTER_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/sample-app-jira-inbound-dead-letter-queue-002
      JIRA_INBOUND_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/sample-app-jira-inbound-queue-002
      LOG_LEVEL: error
      MAX_CONCURRENT_MESSAGES: '6'
      METRICS_ENABLED: 'true'
      METRICS_EXPORTER: otlp-grpc
      NEO4J_AUTHENTICATION_ENABLED: 'true'
      NEO4J_READER_HOSTNAME: sample-pod.example.internal
      NEO4J_SSL_ENABLED: 'true'
      NEO4J_USERNAME: neo4j
      NEO4J_WRITER_HOSTNAME: sample-pod.example.internal
      NODE_OPTIONS: --max-old-space-size=3072
      OTEL_ATTRIBUTE_COUNT_LIMIT: '128'
      OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT: '4095'
      OTEL_COLLECTOR_FQDN: otel-collector.opentelemetry-collector.svc.cluster.local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.opentelemetry-collector.svc.cluster.local:4318
      OTEL_EXPORTER_OTLP_INSECURE: 'true'
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta
      OTEL_RESOURCE_ATTRIBUTES: service.name=executor,environment=sample-env,platform=aws_eks,build.id=1.2.3,project=sample-app,owner=@example/platform,
      PIPELINE_OUTGOING_STREAM_ARN: arn:aws:kinesis:us-east-1:123456789012:stream/query-domain-pipeline-outgoing-stream
      PLATFORM: aws_eks
      POD_ID: '002'
      POD_NAME: sample-pod
      QUERY_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/sample-app-query-queue-002
      REGION: us-east-1
      REMEDIATION_REBUILD_DEAD_LETTER_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/sample-app-remediation-rebuild-dead-letter-queue-002
      REMEDIATION_REBUILD_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/sample-app-remediation-rebuild-queue-002
      SERVICE_NAME: executor
      SHOULD_USE_SECRETS_MANAGER_FOR_NEO4J_CONFIG: 'false'
      SYNC_JOB_DEAD_LETTER_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/sample-app-sync-job-dead-letter-queue-002
      SYNC_JOB_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/sample-app-sync-job-queue-002
      TRACING_ENABLED: 'false'
    additionalLabels: *id001
  envSecretKeys:
  - name: NEO4J_PASSWORD
    secretName: executor
  livenessProbe:
    enabled: true
    failureThreshold: 5
    httpGet:
      path: /health/liveness
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 60
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 15
  readinessProbe:
    enabled: true
    failureThreshold: 8
    httpGet:
      path: /health
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 15
    successThreshold: 1
    timeoutSeconds: 10
externalSecret:
  enabled: true
  name: executor
  refreshInterval: 1h
  secretStoreRef:
    name: configuration-api-webhook
    kind: ClusterSecretStore
  target:
    name: executor
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: NEO4J_PASSWORD
    remoteRef:
      key: sample-app/sample-env/NEO4J_PASSWORD_POD_002
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
vpa:
  enabled: true
  name: executor-vpa
  updateMode: 'Off'
  containerName: '*'
  minAllowed:
    cpu: 250m
    memory: 1536Mi
  maxAllowed:
    cpu: 8
    memory: 8Gi
