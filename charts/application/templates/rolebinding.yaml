{{- if and .Values.rbac.enabled .Values.rbac.roles }}
{{- range .Values.rbac.roles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
{{ include "application.labels.metadata" $ | indent 4 }}
{{- if $.Values.rbac.additionalLabels }}
{{ toYaml $.Values.rbac.additionalLabels | indent 4 }}
{{- end }}
{{- if .bindingLabels }}
{{ toYaml .bindingLabels | indent 4 }}
{{- end }}
{{- if $.Values.rbac.annotations }}
  annotations:
{{ toYaml $.Values.rbac.annotations | indent 4 }}
{{- end }}
  name: {{ .bindingName | default (printf "%s-rolebinding-%s" (include "application.name" $) .name) }}
  namespace: {{ template "application.namespace" $ }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .roleName | default (printf "%s-role-%s" (include "application.name" $) .name) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "application.serviceAccountName" $ }}
    namespace: {{ template "application.namespace" $ }}
{{- end }}
{{- end }}
