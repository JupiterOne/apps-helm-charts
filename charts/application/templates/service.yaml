{{- if .Values.service }}
{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
{{ include "application.labels.metadata" . | indent 4 }}
{{- if .Values.service.additionalLabels }}
{{ toYaml .Values.service.additionalLabels | indent 4 }}
{{- end }}
{{- if .Values.service.annotations }}
  annotations:
{{ include "application.tplvalues.render" ( dict "value" .Values.service.annotations  "context" $ ) | indent 4 }}
{{- end }}
  name: {{ template "application.name" . }}
  namespace: {{ template "application.namespace" $ }}
spec:
{{- if .Values.service.type }}
  type: "{{ .Values.service.type }}"
{{- end }}
  selector:
{{ include "application.labels.selector" . | indent 4 }}
{{- /* The pod labels join the selector unless selectorFromPodLabels is false; a
selector of exactly the immutable `app` label matches workloads created before
this chart managed them. */ -}}
{{- if and .Values.deployment.podLabels (ne .Values.service.selectorFromPodLabels false) }}
{{ toYaml .Values.deployment.podLabels | indent 4 }}
{{- end }}
  ports:
{{ toYaml .Values.service.ports | indent 4 }}
{{- end }}
{{- end }}
