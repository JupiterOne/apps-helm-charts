{{- if .Values.externalSecret }}
{{- if .Values.externalSecret.enabled }}
{{- $es := .Values.externalSecret }}
{{- $name := $es.name | default (include "application.name" .) }}
apiVersion: {{ $es.apiVersion | default "external-secrets.io/v1beta1" }}
kind: ExternalSecret
metadata:
  labels:
{{ include "application.labels.metadata" . | indent 4 }}
{{- if $es.additionalLabels }}
{{ toYaml $es.additionalLabels | indent 4 }}
{{- end }}
{{- if $es.annotations }}
  annotations:
{{ toYaml $es.annotations | indent 4 }}
{{- end }}
  name: {{ $name }}
  namespace: {{ template "application.namespace" . }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ ($es.target | default dict).name | default $name }}
    creationPolicy: {{ ($es.target | default dict).creationPolicy | default "Owner" }}
    deletionPolicy: {{ ($es.target | default dict).deletionPolicy | default "Retain" }}
    {{- with ($es.target | default dict).template }}
    template:
{{ toYaml . | indent 6 }}
    {{- end }}
  {{- with $es.dataFrom }}
  dataFrom:
{{ toYaml . | indent 4 }}
  {{- end }}
  {{- if $es.data }}
  data:
    {{- range $es.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ include "application.tplvalues.render" (dict "value" .remoteRef.key "context" $) }}
        {{- with .remoteRef.property }}
        property: {{ . }}
        {{- end }}
        {{- with .remoteRef.version }}
        version: {{ . }}
        {{- end }}
        {{- /* ESO defaults these at admission; declaring them keeps the desired state
        equal to what the API server stores, which GitOps tools compare against. */}}
        conversionStrategy: {{ .remoteRef.conversionStrategy | default "Default" }}
        decodingStrategy: {{ .remoteRef.decodingStrategy | default "None" }}
        metadataPolicy: {{ .remoteRef.metadataPolicy | default "None" }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
