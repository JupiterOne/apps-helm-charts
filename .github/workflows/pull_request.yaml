name: Pull Request
on:
  pull_request:
    types: [opened, synchronize, edited, ready_for_review]
    branches:
      - main

  workflow_dispatch:
env:
  CHART_NAME: "application"
  CHART_PATH: "charts/application"
jobs:
  build:
    runs-on: ubuntu-latest 
    name: Build
    steps:
    - name: Check out code
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
        ref: ${{github.event.pull_request.head.sha}}
    - name: Setup Ephemeral Kubernetes Testing Cluster
      uses: engineerd/setup-kind@v0.5.0
      with:
        version: "v0.18.0"
    # Set Up Helm
    - name: Set up Helm
      uses: azure/setup-helm@v1
      with:
        version: v3.7.0
    # Check K8s deprecations
    - name: Setup Pluto
      uses: FairwindsOps/pluto/github-action@master
    - name: Run Pluto
      run: helm template ${CHART_NAME} ${CHART_PATH} -f ${CHART_PATH}/values.yaml | pluto detect -
    # Lint
    - name: Helm Lint
      run: |
        helm lint ${CHART_PATH}
    # Every ci/*-values.yaml fixture must render, pass Pluto and validate against the
    # Kubernetes + CRD schemas. The stock values.yaml disables most templates, so the
    # fixtures are what actually exercise them.
    - name: Setup kubeconform
      run: |
        curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
          | tar -xz -C /usr/local/bin kubeconform
    - name: Render and validate fixtures
      run: |
        set -euo pipefail
        for f in ${CHART_PATH}/ci/*-values.yaml; do
          echo "== $(basename "$f")"
          helm template fixture ${CHART_PATH} -n fixture -f "$f" > /tmp/rendered.yaml
          pluto detect /tmp/rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.32.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered.yaml
        done
    # Dry run to ensure that manifests are generated successfully 
    - name: Dry Run Chart
      run: |
        helm install ${CHART_NAME} ${CHART_PATH} -f ${CHART_PATH}/values.yaml -n helm-chart-pipeline-test --dry-run --debug
    # package
    - name: Helm Package
      run: |
        helm package ${CHART_PATH}
    - name: Comment on PR
      uses: mshick/add-pr-comment@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        message: '@${{ github.actor }} Validation Successful'
        allow-repeats: false
    - name: Notify Failure
      if: failure()
      uses: mshick/add-pr-comment@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        message: '@${{ github.actor }} Yikes! You better fix it before anyone else finds out! [Build](https://github.com/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}/checks) has Failed!'
        allow-repeats: false
    - name: Notify Slack
      uses: 8398a7/action-slack@v3
      if: failure() # Only alert on failure
      with:
        status: ${{ job.status }}
        fields: repo,author,action,eventName,ref,workflow
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SLACK_WEBHOOK_URL: ${{ secrets.SRE_TEAM_SLACK_WEBHOOK }}
  
